version: '3.8'

services:
  tie-engine:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PASSWORD=tie_password # Pass the database password to the engine service
    volumes:
      - ./data:/app/data
    depends_on:
      - postgres
    networks:
      - tie-network

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: tie_db
      POSTGRES_USER: tie_user
      POSTGRES_PASSWORD: tie_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - tie-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tie-network

networks:
  tie-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: