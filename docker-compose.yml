version: '3.8'

services:
  tie-engine:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres # Explicitly set for the app to connect to the postgres service
      - DB_PORT=5432
      - DB_NAME=tie_db
      - DB_USER=tie_user
      - DB_PASSWORD=tie_password
    volumes:
      - ./data:/app/data
    depends_on:
      - postgres
    networks:
      - tie-network
    command: sh -c "npm run migrate && npm start" # This command will run migrations then start the app

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: tie_db
      POSTGRES_USER: tie_user
      POSTGRES_PASSWORD: tie_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - tie-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tie-network

networks:
  tie-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: